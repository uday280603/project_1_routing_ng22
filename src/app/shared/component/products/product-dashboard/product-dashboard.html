<div class="container">
    <div class="row d-flex justify-content-end mt-2">
        <button routerLink="add" mat-raised-button>Add Product</button>
    </div>
  <div class="row mt-5">
    <div class="col-md-6">
      <ul class="list-group">
        @for (prod of products(); track prod.productId) {
          <li class="list-group-item" [routerLink]="[prod.productId]">
            {{ prod.productName }}
          </li>
        }
      </ul>
    </div>
    <div class="col-md-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
